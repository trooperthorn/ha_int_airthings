[project]
name = "ha-int-airthings"
version = "0.1.0"
description = "Home Assistant custom integration for local Airthings BLE devices"
requires-python = ">=3.13"

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
show_error_codes = true
plugins = []

[[tool.mypy.overrides]]
module = ["bleak_retry_connector.*", "cbor2.*"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
